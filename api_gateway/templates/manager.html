<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Менеджера | CRM</title>
    <script src="/static/js/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #f5f5f7; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        h1 { color: #333; font-size: 22px; }
        
        .btn { background: #007AFF; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; font-weight: 500; }
        .btn:hover { background: #0056CC; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn-outline { background: white; color: #007AFF; border: 1px solid #007AFF; }
        .btn-green { background: #34C759; }
        .btn-red { background: #FF3B30; }

        /* ФИЛЬТРЫ */
        .filters-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .filters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 11px; text-transform: uppercase; color: #888; font-weight: 700; letter-spacing: 0.5px; }
        .filter-group input, .filter-group select { padding: 9px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; outline: none; }
        .filter-row-actions { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #f0f0f0; justify-content: flex-end; align-items: center; }

        /* ТАБЛИЦА */
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1300px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: #f8f9fa; color: #555; font-weight: 600; cursor: pointer; user-select: none; transition: 0.2s; white-space: nowrap; position: relative; }
        th:hover { background: #eef1f5; color: #007AFF; }
        
        .sort-icon::after { content: '↕'; margin-left: 8px; opacity: 0.3; font-size: 11px; }
        th.sort-asc .sort-icon::after { content: '↑'; opacity: 1; color: #007AFF; }
        th.sort-desc .sort-icon::after { content: '↓'; opacity: 1; color: #007AFF; }
        
        .is-vip-row { background: #fffcf0; }
        .vip-star { color: #FF9500; font-size: 16px; font-weight: bold; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
        
        .status-created { background: #E3F2FD; color: #1976D2; }
        .status-scheduled { background: #FFF3E0; color: #E65100; }
        .status-in_work { background: #E1F5FE; color: #0288D1; border: 1px solid #0288D1; }
        .status-done { background: #E8F5E9; color: #2E7D32; }
        .status-canceled { background: #FFEBEE; color: #C62828; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 95%; max-width: 900px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .modal-content h2 { font-size: 22px; font-weight: 700; color: #1c1c1e; margin-bottom: 25px; }
        .modal-content h3 { font-size: 12px; font-weight: 700; color: #007AFF; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 15px 0; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #444; }
        .form-group input, .form-group select { padding: 12px 15px; border: 1.5px solid #e1e1e7; border-radius: 12px; font-size: 14px; transition: all 0.2s ease; background: #fbfbfd; outline: none; color: #1c1c1e; }
        .form-group input:focus { border-color: #007AFF; background: #fff; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
        .form-group input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: #FF9500; }

        .mapping-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 12px; background: #f8f9fa; border-radius: 12px; margin-bottom: 8px; align-items: center; border: 1px solid #eee; }
        .mapping-label { font-weight: 600; font-size: 14px; }

        .loader { display: none; width: 25px; height: 25px; border: 3px solid #f3f3f3; border-top: 3px solid #007AFF; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>📝 Менеджер: Управление заявками</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div id="main-loader" class="loader"></div>
            <button class="btn btn-outline" onclick="goToProfile()">👤 Профиль</button>
            <button class="btn btn-green" onclick="openEditModal()">+ Новая заявка</button>
            <button class="btn" onclick="document.getElementById('excel-input').click()">📁 Импорт Excel</button>
            <input type="file" id="excel-input" style="display:none" accept=".xlsx, .xls" onchange="handleExcel(event)">
            <button class="btn btn-red" onclick="logout()">Выйти</button>
        </div>
    </div>

    <div class="filters-container">
        <div class="filters-grid">
            <div class="filter-group"><label>Клиент</label><input type="text" id="f-name" placeholder="Фамилия..." oninput="filterData()"></div>
            <div class="filter-group"><label>Телефон</label><input type="text" id="f-phone" placeholder="79..." oninput="filterData()"></div>
            <div class="filter-group"><label>Город</label><input type="text" id="f-city" placeholder="Город..." oninput="filterData()"></div>
            <div class="filter-group"><label>Улица</label><input type="text" id="f-street" placeholder="Улица..." oninput="filterData()"></div>
            <div class="filter-group"><label>№ Договора</label><input type="text" id="f-contract" placeholder="№..." oninput="filterData()"></div>
            <div class="filter-group">
                <label>Статус</label>
                <select id="f-status" onchange="filterData()">
                    <option value="all">Все статусы</option>
                    <option value="created">Создана</option>
                    <option value="scheduled">Распределена</option>
                    <option value="in_work">В работе</option>
                    <option value="done">Выполнена</option>
                    <option value="canceled">Отменена</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Приоритет</label>
                <select id="f-vip" onchange="filterData()">
                    <option value="all">Все клиенты</option>
                    <option value="vip">Только VIP ⭐️</option>
                    <option value="not_vip">Без VIP</option>
                </select>
            </div>
            <div class="filter-group"><label>Договор С</label><input type="date" id="f-date-start" onchange="filterData()"></div>
            <div class="filter-group"><label>Договор ПО</label><input type="date" id="f-date-end" onchange="filterData()"></div>
        </div>
        <div class="filter-row-actions">
            <span id="counter" style="font-size: 13px; color: #666; margin-right: auto;">Записей: 0</span>
            <button class="btn btn-outline" onclick="resetFilters()">Сбросить</button>
            <button class="btn" onclick="loadData()">🔄 Обновить</button>
        </div>
    </div>

    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                    <tr id="table-headers">
                        <th onclick="setSort('is_vip')" data-field="is_vip">VIP <span class="sort-icon"></span></th>
                        <th onclick="setSort('last_name')" data-field="last_name">Клиент <span class="sort-icon"></span></th>
                        <th onclick="setSort('phone')" data-field="phone">Телефон <span class="sort-icon"></span></th>
                        <th onclick="setSort('city')" data-field="city">Полный адрес <span class="sort-icon"></span></th>
                        <th onclick="setSort('contract_number')" data-field="contract_number">№ Договора <span class="sort-icon"></span></th>
                        <th onclick="setSort('contract_date')" data-field="contract_date">Дата дог. <span class="sort-icon"></span></th>
                        <th onclick="setSort('status')" data-field="status">Статус <span class="sort-icon"></span></th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- МОДАЛКИ -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h2 id="modal-title">Заявка</h2>
            <form id="visit-form" onsubmit="saveVisit(event)">
                <h3>Данные клиента</h3>
                <div class="form-grid">
                    <div class="form-group"><label>Фамилия*</label><input type="text" id="lastname" required></div>
                    <div class="form-group"><label>Имя*</label><input type="text" id="firstname" required></div>
                    <div class="form-group"><label>Отчество</label><input type="text" id="surname"></div>
                    <div class="form-group"><label>Телефон*</label><input type="text" id="phone" required></div>
                    <div class="form-group" style="flex-direction:row; align-items:center; gap:12px; margin-top: 22px;">
                        <input type="checkbox" id="is_vip">
                        <label style="color: #FF9500; font-weight:bold; cursor:pointer;" for="is_vip">⭐️ VIP КЛИЕНТ</label>
                    </div>
                </div>
                <h3>Адрес объекта</h3>
                <div class="form-grid">
                    <div class="form-group"><label>Регион</label><input type="text" id="region"></div>
                    <div class="form-group"><label>Город</label><input type="text" id="city"></div>
                    <div class="form-group"><label>Район / НП</label><input type="text" id="locality"></div>
                    <div class="form-group"><label>Улица</label><input type="text" id="street"></div>
                </div>
                <div class="form-grid" style="grid-template-columns: repeat(4, 1fr);">
                    <div class="form-group"><label>Дом*</label><input type="number" id="housenumber" required></div>
                    <div class="form-group"><label>Литера</label><input type="text" id="letter"></div>
                    <div class="form-group"><label>Корпус</label><input type="number" id="building"></div>
                    <div class="form-group"><label>Квартира</label><input type="number" id="appartment"></div>
                </div>
                <h3>Договор</h3>
                <div class="form-grid">
                    <div class="form-group"><label>№ Контракта</label><input type="text" id="contractnumber"></div>
                    <div class="form-group"><label>Дата контракта</label><input type="date" id="contractdate"></div>
                    <div class="form-group"><label>Месяц назначения</label><input type="month" id="assignedmonth"></div>
                </div>
                <div style="display:flex; justify-content: flex-end; gap:12px; margin-top: 30px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal('edit-modal')">Отмена</button>
                    <button type="submit" class="btn">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="mapping-modal">
        <div class="modal-content" style="max-width: 650px;">
            <h2>Настройка импорта Excel</h2>
            <div style="margin-bottom: 20px; padding: 15px; background: #fff3cd; border-radius: 12px; font-size: 13px; color: #856404; border: 1px solid #ffeeba;">
                💡 <strong>Подсказка:</strong> Выберите нужный лист, тип файла и строку начала данных.
                <div style="margin-top: 10px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                    Лист: <select id="excel-sheet-select" onchange="onSheetChange()" style="padding: 4px; border-radius: 6px;"></select>
                    Тип файла: 
                    <select id="excel-template-select" style="padding: 4px; border-radius: 6px;">
                        <option value="type1">Реестр</option>
                        <option value="type2" selected>Поручение</option>
                    </select>
                    Начать со строки №: <input type="number" id="excel-start-row" value="9" min="1" style="width: 50px; padding: 4px; border-radius: 6px;">
                </div>
            </div>
            <div id="mapping-container"></div>
            <div style="display:flex; justify-content: flex-end; gap:12px; margin-top: 30px;">
                <button type="button" class="btn btn-outline" id="import-cancel-btn" onclick="closeModal('mapping-modal')">Отмена</button>
                <button type="button" class="btn btn-green" id="import-submit-btn" onclick="processImport()">Начать загрузку</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = `${window.location.protocol}//${window.location.hostname}:3425`;
        let allData = []; 
        let allMasters = [];
        let currentEditId = null;
        let currentVisitData = null; 
        let currentWorkbook = null; 
        let rawExcelRows = []; 
        let sortField = 'is_vip';
        let sortOrder = 'desc';

        const statusMap = {
            'created': { text: 'Создана', class: 'status-created' },
            'scheduled': { text: 'Распределена', class: 'status-scheduled' },
            'in_work': { text: 'В работе', class: 'status-in_work' },
            'done': { text: 'Выполнена', class: 'status-done' },
            'canceled': { text: 'Отменена', class: 'status-canceled' }
        };

        const DB_FIELDS = [
            { id: 'smart_fio', label: 'ФИО (в одну колонку)*' },
            { id: 'phone', label: 'Телефон*' },
            { id: 'smart_address', label: 'Адрес (в одну колонку)' },
            { id: 'smart_contract', label: 'Договор (№ и Дата)' },
            { id: 'time_info', label: 'Время / Комментарий' },
            { id: 'assigned_month', label: 'Месяц назначения' },
            { id: 'scheduled_date', label: 'Дата визита' },
            { id: 'amount', label: 'Сумма' },
            { id: 'equipment_description', label: 'Оборудование' },
            { id: 'master_name', label: 'ФИО Мастера' }
        ];

        const REFUSAL_PATTERNS = ['отказ', 'неверный номер', 'не желает', 'отключено', 'недозвон', 'не в сети', 'новый собственник'];
        const NOISE_KEYWORDS = ['обход', 'проверка', 'техническое', 'инструктаж', 'котел', 'пусконаладка', 'ремонт', 'содержание работ'];

        // --- ЛОГИКА ОТОБРАЖЕНИЯ (ВОССТАНОВЛЕНА) ---

        async function loadData() {
            document.getElementById('main-loader').style.display = 'inline-block';
            try {
                const token = localStorage.getItem('auth_token');
                const [vRes, mRes] = await Promise.all([
                    fetch(`${API_URL}/visit/visits`, { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch(`${API_URL}/user/masters`, { headers: { 'Authorization': `Bearer ${token}` } })
                ]);
                allData = await vRes.json();
                allMasters = await mRes.json();
                filterData();
            } catch (e) { console.error(e); }
            finally { document.getElementById('main-loader').style.display = 'none'; }
        }

        function filterData() {
            const f = {
                name: document.getElementById('f-name').value.toLowerCase(),
                phone: document.getElementById('f-phone').value,
                city: document.getElementById('f-city').value.toLowerCase(),
                street: document.getElementById('f-street').value.toLowerCase(),
                contract: document.getElementById('f-contract').value.toLowerCase(),
                status: document.getElementById('f-status').value,
                vip: document.getElementById('f-vip').value,
                start: document.getElementById('f-date-start').value,
                end: document.getElementById('f-date-end').value
            };
            let filtered = allData.filter(v => {
                const d = v.contract_date ? v.contract_date.split('T')[0] : '';
                return `${v.client.last_name} ${v.client.first_name}`.toLowerCase().includes(f.name) &&
                       v.client.phone.includes(f.phone) &&
                       v.address.city.toLowerCase().includes(f.city) &&
                       v.address.street.toLowerCase().includes(f.street) &&
                       v.contract_number.toLowerCase().includes(f.contract) &&
                       (f.status === 'all' || v.status === f.status) &&
                       (f.vip === 'all' || (f.vip === 'vip' && v.client.is_vip) || (f.vip === 'not_vip' && !v.client.is_vip)) &&
                       (!f.start || d >= f.start) && (!f.end || d <= f.end);
            });
            document.getElementById('counter').innerText = `Записей: ${filtered.length}`;
            applySort(filtered);
        }

        function applySort(data) {
            const acc = {
                is_vip: v => v.client.is_vip,
                last_name: v => v.client.last_name.toLowerCase(),
                phone: v => v.client.phone,
                city: v => (v.address.region + v.address.city + v.address.street).toLowerCase(),
                contract_number: v => (v.contract_number || "").toLowerCase(),
                contract_date: v => v.contract_date || '',
                status: v => v.status
            };
            data.sort((a, b) => {
                let vA = acc[sortField](a), vB = acc[sortField](b);
                if (vA < vB) return sortOrder === 'asc' ? -1 : 1;
                if (vA > vB) return sortOrder === 'asc' ? 1 : -1;
                return 0;
            });
            renderTable(data);
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            data.forEach(v => {
                const row = document.createElement('tr');
                if (v.client.is_vip) row.classList.add('is-vip-row');
                const st = statusMap[v.status] || { text: v.status, class: '' };
                const a = v.address;
                const addr = [a.city ? 'г. '+a.city : '', a.region ? 'р-н '+a.region : '', a.locality ? 'р-н '+a.locality : '', a.street ? 'ул. '+a.street : '', a.house_number ? 'д.'+a.house_number : ''].filter(Boolean).join(', ');
                row.innerHTML = `
                    <td><span class="vip-star">${v.client.is_vip ? '⭐️' : ''}</span></td>
                    <td><strong>${v.client.last_name}</strong> ${v.client.first_name} ${v.client.surname || ''}</td>
                    <td>${v.client.phone}</td>
                    <td style="max-width:320px;">${addr}</td>
                    <td>${v.contract_number || '-'}</td>
                    <td>${v.contract_date ? new Date(v.contract_date).toLocaleDateString() : '-'}</td>
                    <td><span class="status-badge ${st.class}">${st.text}</span></td>
                    <td><button class="btn btn-outline" style="padding:4px 8px" onclick='editVisit(${JSON.stringify(v)})'>✏️</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateSortVisuals() {
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.getAttribute('data-field') === sortField) th.classList.add(sortOrder === 'asc' ? 'sort-asc' : 'sort-desc');
            });
        }

        function setSort(field) {
            sortOrder = (sortField === field && sortOrder === 'asc') ? 'desc' : 'asc';
            sortField = field;
            updateSortVisuals();
            filterData();
        }

        // --- УМНЫЙ ПАРСИНГ ---

        function splitSmartFio(str) {
            if (!str) return { last: '', first: 'Имя', sur: '', extra: '' };
            const words = str.trim().split(/\s+/);
            const nameParts = [];
            const extraParts = [];
            words.forEach((word) => {
                const isNameLike = /^[А-ЯЁA-Z][а-яёa-z]*$/.test(word.replace(/[^а-яёa-zА-ЯЁA-Z]/g, ''));
                if (nameParts.length < 3 && isNameLike) nameParts.push(word);
                else extraParts.push(word);
            });
            return { last: nameParts[0] || '', first: nameParts[1] || 'Имя', sur: nameParts[2] || '', extra: extraParts.join(' ') };
        }

        function extractPhones(raw) {
            if (!raw) return "";
            const parts = String(raw).split(/[;,\n]+/);
            const unique = new Set();
            parts.forEach(part => {
                let digits = part.replace(/\D/g, '');
                if (digits.length === 11 && (digits[0] === '7' || digits[0] === '8')) unique.add("7" + digits.substring(1));
                else if (digits.length === 10) unique.add("7" + digits);
                else if (digits.length === 7) unique.add("7812" + digits);
            });
            return Array.from(unique).join('; ');
        }

        function extractTime(timeRaw) {
            if (!timeRaw) return { time: null, comment: null };
            const timeStr = String(timeRaw).trim();
            const timeRegex = /(?:с\s+)?(\d{1,2}[.:]\d{2})\s*(?:до|-|–)\s*(\d{1,2}[.:]\d{2})/i;
            const match = timeStr.match(timeRegex);
            if (match) {
                const extracted = `${match[1].replace('.', ':')}-${match[2].replace('.', ':')}`;
                const remaining = timeStr.replace(match[0], '').replace(/^[,\s]+/, '').trim();
                return { time: extracted, comment: remaining || null };
            }
            return { time: null, comment: timeStr };
        }

        function parseSmartAddress(str) {
            const res = { region: '', city: '', locality: '', street: '', house: 0, letter: '', build: '' };
            if (!str) return res;
            const cityMatch = str.match(/г\.\s?([А-Яа-я\-]+)/);
            if (cityMatch) res.city = cityMatch[1];
            const regionMatch = str.match(/район\s?([А-Яа-я\-]+)/);
            if (regionMatch) res.region = regionMatch[1];
            const streetMatch = str.match(/(?:улица|ул\.|пер\.|переулок|переулок)\s?([А-Яа-я\s\-]+?)(?:,|$)/);
            if (streetMatch) res.street = streetMatch[1].trim();
            const houseMatch = str.match(/(?:дом|д\.)\s?(\d+)/);
            if (houseMatch) res.house = parseInt(houseMatch[1]);
            if (!res.city) res.city = str.split(',')[0].trim();
            return res;
        }

        function parseSmartContract(str) {
            if (!str) return { num: '', date: null };
            const contractRegex = /№\s?([\d.ТОд\-]+)\s+от\s+(\d{2}\.\d{2}\.\d{4})/;
            const match = str.match(contractRegex);
            if (match) {
                const [d, m, y] = match[2].split('.');
                return { num: `№${match[1]}`, date: `${y}-${m}-${d}T00:00:00Z` };
            }
            return { num: str.trim(), date: null };
        }

        function parseExcelDate(val) {
            if (!val) return null;
            if (typeof val === 'number') return new Date((val - 25569) * 86400 * 1000).toISOString();
            const dateMatch = String(val).match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
            if (dateMatch) return `${dateMatch[3]}-${dateMatch[2].padStart(2, '0')}-${dateMatch[1].padStart(2, '0')}T00:00:00Z`;
            return null;
        }

        function findMasterId(masterRawName) {
            if (!masterRawName) return null;
            const words = String(masterRawName).trim().split(' ');
            if (!words[0] || !/^[А-ЯЁ][а-яё]+$/.test(words[0])) return null;
            const lastName = words[0].toLowerCase();
            const master = allMasters.find(m => (m.last_name || '').toLowerCase() === lastName);
            return master ? master.id : null;
        }

        function checkRefusal(text) {
            if (!text) return false;
            const t = text.toLowerCase();
            return REFUSAL_PATTERNS.some(p => t.includes(p));
        }

        // --- EXCEL ---

        function handleExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                currentWorkbook = XLSX.read(data, { type: 'array' });
                const select = document.getElementById('excel-sheet-select');
                select.innerHTML = currentWorkbook.SheetNames.map(n => `<option value="${n}">${n}</option>`).join('');
                onSheetChange();
                document.getElementById('mapping-modal').style.display = 'flex';
            };
            reader.readAsArrayBuffer(file);
            event.target.value = ''; 
        }

        function onSheetChange() {
            const sheetName = document.getElementById('excel-sheet-select').value;
            rawExcelRows = XLSX.utils.sheet_to_json(currentWorkbook.Sheets[sheetName], { header: 1 });
            showMappingUI();
        }

        function showMappingUI() {
            const container = document.getElementById('mapping-container');
            const startRowInput = parseInt(document.getElementById('excel-start-row').value) || 2;
            const sampleIdx = startRowInput - 1; 
            const sample = rawExcelRows[sampleIdx] || rawExcelRows[sampleIdx + 1] || rawExcelRows[0] || [];
            
            container.innerHTML = '';
            DB_FIELDS.forEach(field => {
                let opts = '<option value="-1">-- Пропустить --</option>';
                sample.forEach((c, i) => {
                    const letter = String.fromCharCode(65 + i);
                    const preview = c ? String(c).substring(0,25) : 'пусто';
                    opts += `<option value="${i}">Кол. ${letter} (${preview})</option>`;
                });
                container.innerHTML += `<div class="mapping-row"><span class="mapping-label">${field.label}</span><select class="excel-col-selector" data-db-field="${field.id}">${opts}</select></div>`;
            });
        }

        async function processImport() {
            const btnSubmit = document.getElementById('import-submit-btn');
            const startRow = (parseInt(document.getElementById('excel-start-row').value) || 2) - 1;
            const template = document.getElementById('excel-template-select').value;
            const mapping = {};
            document.querySelectorAll('.excel-col-selector').forEach(s => {
                const val = parseInt(s.value);
                if (val !== -1) mapping[s.getAttribute('data-db-field')] = val;
            });

            if (mapping.smart_fio === undefined) return alert("Сопоставьте ФИО");

            btnSubmit.disabled = true; btnSubmit.innerText = "Загрузка...";
            document.getElementById('main-loader').style.display = 'inline-block';

            let lastFio = "", lastPhone = "", lastAddr = "", lastContract = "";

            for (let i = startRow; i < rawExcelRows.length; i++) {
                const row = rawExcelRows[i];
                if (!row || row.length === 0 || row.every(c => !c)) continue;

                if (template === 'type2') {
                    const cellValue = String(row[mapping.smart_fio] || "").toLowerCase();
                    if (NOISE_KEYWORDS.some(k => cellValue.includes(k))) continue;
                    if (!row[mapping.smart_fio]) continue;
                }

                const fRaw = row[mapping.smart_fio] ? String(row[mapping.smart_fio]) : lastFio;
                const pRaw = mapping.phone !== -1 && row[mapping.phone] ? String(row[mapping.phone]) : lastPhone;
                const aRaw = mapping.smart_address !== -1 && row[mapping.smart_address] ? String(row[mapping.smart_address]) : lastAddr;
                const cRaw = mapping.smart_contract !== -1 && row[mapping.smart_contract] ? String(row[mapping.smart_contract]) : lastContract;

                if (!fRaw.trim()) continue;
                lastFio = fRaw; lastPhone = pRaw; lastAddr = aRaw; lastContract = cRaw;

                const fioData = splitSmartFio(fRaw);
                const addrData = parseSmartAddress(aRaw);
                const contData = parseSmartContract(cRaw);
                const timeData = extractTime(row[mapping.time_info]);
                const masterId = mapping.master_name !== -1 ? findMasterId(row[mapping.master_name]) : null;
                const refusalInfo = (template === 'type2' && (checkRefusal(fRaw) || checkRefusal(String(row[mapping.time_info]||"")))) ? "ОТКАЗ/НЕУДАЧА" : "";
                
                const payload = {
                    client: { last_name: fioData.last, first_name: fioData.first, surname: fioData.sur, phone: extractPhones(pRaw), is_vip: false },
                    address: { region: addrData.region, city: addrData.city, street: addrData.street, house_number: addrData.house, building: parseInt(addrData.build) || null },
                    contract_number: contData.num,
                    contract_date: contData.date,
                    assigned_month: String(row[mapping.assigned_month] || ''),
                    scheduled_date: mapping.scheduled_date !== -1 ? parseExcelDate(row[mapping.scheduled_date]) : null,
                    amount: mapping.amount !== -1 ? parseFloat(String(row[mapping.amount] || '0').replace(',', '.')) : 0,
                    equipment_description: mapping.equipment_description !== -1 ? String(row[mapping.equipment_description] || '') : '',
                    scheduled_time: timeData.time,
                    dispatcher_comment: [fioData.extra, timeData.comment, refusalInfo].filter(Boolean).join('; '),
                    master_id: masterId,
                    status: masterId ? "scheduled" : "created"
                };

                await fetch(`${API_URL}/visit/visits`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('auth_token')}` },
                    body: JSON.stringify(payload)
                });
            }
            btnSubmit.disabled = false; btnSubmit.innerText = "Начать загрузку";
            closeModal('mapping-modal');
            loadData();
        }

        // --- CRUD ---

        function openEditModal() {
            currentEditId = null; currentVisitData = null;
            document.getElementById('modal-title').innerText = "Новая заявка";
            document.getElementById('visit-form').reset();
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function editVisit(v) {
            currentEditId = v.id; currentVisitData = v;
            document.getElementById('modal-title').innerText = "Редактировать заявку";
            document.getElementById('lastname').value = v.client.last_name || '';
            document.getElementById('firstname').value = v.client.first_name || '';
            document.getElementById('surname').value = v.client.surname || '';
            document.getElementById('phone').value = v.client.phone || '';
            document.getElementById('is_vip').checked = v.client.is_vip || false;
            document.getElementById('region').value = v.address.region || '';
            document.getElementById('city').value = v.address.city || '';
            document.getElementById('locality').value = v.address.locality || '';
            document.getElementById('street').value = v.address.street || '';
            document.getElementById('housenumber').value = v.address.house_number || '';
            document.getElementById('letter').value = v.address.letter || '';
            document.getElementById('building').value = v.address.building || '';
            document.getElementById('appartment').value = v.address.appartment_number || '';
            document.getElementById('contractnumber').value = v.contract_number || '';
            if(v.contract_date) document.getElementById('contractdate').value = v.contract_date.split('T')[0];
            if(v.assigned_month) document.getElementById('assignedmonth').value = v.assigned_month;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        async function saveVisit(event) {
            event.preventDefault();
            let p = currentEditId ? { ...currentVisitData } : { client: {}, address: {} };
            p.client.last_name = document.getElementById('lastname').value;
            p.client.first_name = document.getElementById('firstname').value;
            p.client.surname = document.getElementById('surname').value;
            p.client.phone = document.getElementById('phone').value;
            p.client.is_vip = document.getElementById('is_vip').checked;
            p.address.region = document.getElementById('region').value;
            p.address.city = document.getElementById('city').value;
            p.address.locality = document.getElementById('locality').value;
            p.address.street = document.getElementById('street').value;
            p.address.house_number = parseInt(document.getElementById('housenumber').value) || 0;
            p.address.letter = document.getElementById('letter').value;
            p.address.building = parseInt(document.getElementById('building').value) || null;
            p.address.appartment_number = parseInt(document.getElementById('appartment').value) || null;
            p.contract_number = document.getElementById('contractnumber').value;
            p.contract_date = document.getElementById('contractdate').value ? document.getElementById('contractdate').value + "T00:00:00Z" : null;
            p.assigned_month = document.getElementById('assignedmonth').value;
            if (!currentEditId) p.status = "created";
            
            const res = await fetch(currentEditId ? `${API_URL}/visit/visits/${currentEditId}` : `${API_URL}/visit/visits`, {
                method: currentEditId ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('auth_token')}` },
                body: JSON.stringify(p)
            });
            if (res.ok) { closeModal('edit-modal'); loadData(); }
        }

        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
            if (id === 'mapping-modal') { rawExcelRows = []; document.getElementById('mapping-container').innerHTML = ''; currentWorkbook = null; }
        }

        function logout() { localStorage.clear(); window.location.href = '/'; }
        function goToProfile() {
            const token = localStorage.getItem('auth_token');
            const payload = JSON.parse(atob(token.split('.')[1]));
            localStorage.setItem('profile_user_id', payload.user_id || payload.id);
            window.location.href = `/user/profile?token=${encodeURIComponent(token)}`;
        }
        
        loadData();
    </script>
</body>
