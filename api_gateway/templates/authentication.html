<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { max-width: 900px; width: 100%; }
        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 768px) { .cards { grid-template-columns: 1fr; } }
        .card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        h1 { color: #333; margin-bottom: 20px; text-align: center; }
        h2 { color: #667eea; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        input:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #5a67d8; }
        .switch { background: white; color: #667eea; border: 1px solid #667eea; }
        .message { padding: 10px; border-radius: 5px; margin-top: 15px; text-align: center; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
        .form-section { display: none; }
        .active { display: block; }
        .hint { font-size: 12px; color: #666; margin-top: 3px; }
        .loader { display: none; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Аутентификация</h1>
        <div class="cards">
            <div class="card">
                <h2>Вход</h2>
                <div id="login-section" class="form-section active">
                    <form id="login-form">
                        <div class="form-group"><label>Имя пользователя</label><input type="text" id="login-username" placeholder="Ваш username" required></div>
                        <div class="form-group"><label>Пароль</label><input type="password" id="login-password" placeholder="Пароль" required></div>
                        <button type="submit"><span>Войти</span><div class="loader" id="login-loader"></div></button>
                        <button type="button" class="switch" onclick="showForm('register')">Нет аккаунта? Регистрация</button>
                    </form>
                    <div id="login-message" class="message"></div>
                </div>
            </div>
            <div class="card">
                <h2>Регистрация</h2>
                <div id="register-section" class="form-section">
                    <form id="register-form">
                        <div class="form-group"><label>Имя пользователя</label><input type="text" id="register-username" placeholder="Придумайте username" required><div class="hint">Латинские буквы и цифры, 3-50 символов</div></div>
                        <div class="form-group"><label>Пароль</label><input type="password" id="register-password" placeholder="Пароль" required><div class="hint">Минимум 8 символов</div></div>
                        <div class="form-group"><label>Подтверждение пароля</label><input type="password" id="confirm-password" placeholder="Повторите пароль" required></div>
                        <button type="submit"><span>Зарегистрироваться</span><div class="loader" id="register-loader"></div></button>
                        <button type="button" class="switch" onclick="showForm('login')">Уже есть аккаунт? Войти</button>
                    </form>
                    <div id="register-message" class="message"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ✅ ДИНАМИЧЕСКОЕ ОПРЕДЕЛЕНИЕ API_URL
        const API_URL = `${window.location.protocol}//${window.location.hostname}:3425`;
        
        console.log('🌐 Connecting to API:', API_URL);
        
        const forms = { login: document.getElementById('login-section'), register: document.getElementById('register-section') };
        const messages = { login: document.getElementById('login-message'), register: document.getElementById('register-message') };
        const loaders = { login: document.getElementById('login-loader'), register: document.getElementById('register-loader') };

        // Перехват fetch для добавления токена
        const originalFetch = window.fetch;
        window.fetch = function(url, options = {}) {
            const token = localStorage.getItem('auth_token');
            if (token) {
                options.headers = options.headers || {};
                options.headers['Authorization'] = `Bearer ${token}`;
            }
            return originalFetch.call(this, url, options);
        };

        // Функция для редиректа на GET /table с токеном в заголовке
        async function redirectToTableWithToken(token) {
            localStorage.setItem('auth_token', token);
            // Редирект с токеном в query параметре
            window.location.href = `/table?token=${encodeURIComponent(token)}`;
        }

        // Проверка авторизации при загрузке страницы
        (function() {
            const token = localStorage.getItem('auth_token');
            if (token) {
                console.log('Токен найден, проверка валидности...');
                
                fetch(`${API_URL}/auth/verify`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(res => {
                    if (res.ok) {
                        console.log('Токен валиден, перенаправление на /table');
                        window.location.href = '/table';
                    } else {
                        console.log('Токен невалиден, удаляем');
                        localStorage.removeItem('auth_token');
                    }
                })
                .catch(() => {
                    console.log('Сервер недоступен');
                });
            }
        })();

        function showForm(form) {
            Object.values(forms).forEach(f => f.classList.remove('active'));
            forms[form].classList.add('active');
            clearMessages();
        }

        function clearMessages() {
            Object.values(messages).forEach(m => { 
                m.className = 'message'; 
                m.textContent = ''; 
            });
        }

        function showMessage(type, text, isError) {
            const msg = messages[type];
            msg.textContent = text;
            msg.className = `message ${isError ? 'error' : 'success'}`;
            if (!isError) {
                setTimeout(() => {
                    msg.className = 'message';
                    msg.textContent = '';
                }, 5000);
            }
        }

        function validateUsername(username) {
            return /^[a-zA-Z0-9]{3,50}$/.test(username) ? null : 'Имя пользователя: латинские буквы и цифры (3-50 символов)';
        }

        function validatePassword(password) {
            return password.length >= 8 ? null : 'Пароль должен быть не менее 8 символов';
        }

        async function handleSubmit(type, data) {
            const endpoint = `${API_URL}/auth/${type}`;
            const loader = loaders[type];
            const btn = document.querySelector(`#${type}-form button[type="submit"]`);
            
            loader.style.display = 'inline-block';
            btn.disabled = true;

            try {
                console.log(`Отправка ${type} запроса:`, endpoint);
                
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                // ✅ РЕГИСТРАЦИЯ - только статус, без JSON
                if (type === 'register') {
                    if (res.status === 201) {
                        showMessage('register', '✅ Регистрация успешна!', false);
                        
                        setTimeout(() => {
                            showForm('login');
                            document.getElementById('login-username').value = data.username;
                            document.getElementById('login-password').value = '';
                            showMessage('login', '✅ Регистрация успешна! Теперь войдите в систему', false);
                        }, 500);
                        return;
                    } else {
                        // Пытаемся получить ошибку, если есть
                        let errorMsg = `Ошибка ${res.status}`;
                        try {
                            const errorData = await res.json();
                            errorMsg = errorData.error || errorMsg;
                        } catch (e) {}
                        
                        showMessage('register', `❌ ${errorMsg}`, true);
                        return;
                    }
                }
                
                // ✅ ЛОГИН - ждем JSON с токеном
                if (type === 'login') {
                    const responseData = await res.json();
                    
                    if (res.ok && responseData.token) {
                        showMessage('login', '✅ Вход выполнен!', false);
                        redirectToTableWithToken(responseData.token);
                    } else {
                        const errorMsg = responseData.error || `Ошибка ${res.status}`;
                        showMessage('login', `❌ ${errorMsg}`, true);
                    }
                    return;
                }
                
            } catch (err) {
                console.error('Ошибка:', err);
                showMessage(type, '❌ Ошибка сети. Проверьте подключение к серверу', true);
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
            }
        }

        // Обработчик формы входа
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            
            const usernameErr = validateUsername(username);
            if (usernameErr) {
                return showMessage('login', usernameErr, true);
            }
            
            if (!password) {
                return showMessage('login', 'Введите пароль', true);
            }
            
            await handleSubmit('login', { username, password });
        };

        // Обработчик формы регистрации
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('confirm-password').value;
            
            const usernameErr = validateUsername(username);
            if (usernameErr) {
                return showMessage('register', usernameErr, true);
            }
            
            const passwordErr = validatePassword(password);
            if (passwordErr) {
                return showMessage('register', passwordErr, true);
            }
            
            if (password !== confirm) {
                return showMessage('register', '❌ Пароли не совпадают', true);
            }
            
            await handleSubmit('register', { username, password });
        };

        // Валидация в реальном времени
        document.getElementById('register-username').oninput = function() {
            const isValid = /^[a-zA-Z0-9]*$/.test(this.value);
            this.style.borderColor = !isValid && this.value.length > 0 ? '#ff4757' : '#ddd';
        };

        document.getElementById('register-password').oninput = function() {
            const confirmInput = document.getElementById('confirm-password');
            this.style.borderColor = this.value.length < 8 && this.value.length > 0 ? '#ff4757' : '#ddd';
            
            if (confirmInput.value) {
                confirmInput.style.borderColor = this.value !== confirmInput.value ? '#ff4757' : '#ddd';
            }
        };

        document.getElementById('confirm-password').oninput = function() {
            const password = document.getElementById('register-password').value;
            this.style.borderColor = this.value !== password ? '#ff4757' : '#ddd';
        };

        console.log('Страница авторизации загружена');
    </script>
</body>
</html>
