<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Диспетчера</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #f5f5f7; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        h1 { color: #333; font-size: 22px; }
        
        .btn { background: #007AFF; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; font-weight: 500; }
        .btn:hover { background: #0056CC; }
        .btn-outline { background: white; color: #007AFF; border: 1px solid #007AFF; }
        .btn-green { background: #34C759; }
        .btn-red { background: #FF3B30; }

        .filters-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .filters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 11px; text-transform: uppercase; color: #888; font-weight: 700; letter-spacing: 0.5px; }
        .filter-group input, .filter-group select { padding: 9px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; outline: none; }
        .filter-row-actions { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #f0f0f0; justify-content: flex-end; align-items: center; }

        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1400px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: #f8f9fa; color: #555; font-weight: 600; cursor: pointer; user-select: none; transition: 0.2s; white-space: nowrap; position: relative; }
        th:hover { background: #eef1f5; color: #007AFF; }
        
        .sort-icon::after { content: '↕'; margin-left: 8px; opacity: 0.3; font-size: 11px; }
        th.sort-asc .sort-icon::after { content: '↑'; opacity: 1; color: #007AFF; }
        th.sort-desc .sort-icon::after { content: '↓'; opacity: 1; color: #007AFF; }
        
        .is-vip-row { background: #fffcf0; }
        .vip-star { color: #FF9500; font-size: 16px; font-weight: bold; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
        
        .status-created { background: #E3F2FD; color: #1976D2; }
        .status-scheduled { background: #FFF3E0; color: #E65100; }
        .status-in_work { background: #E1F5FE; color: #0288D1; border: 1px solid #0288D1; }
        .status-done { background: #E8F5E9; color: #2E7D32; }
        .status-canceled { background: #FFEBEE; color: #C62828; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 95%; max-width: 900px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .info-block { background: #f8f9fb; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1.5px solid #eef0f2; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #444; }
        .form-group input, .form-group select, .form-group textarea { padding: 12px 15px; border: 1.5px solid #e1e1e7; border-radius: 12px; font-size: 14px; background: #fbfbfd; outline: none; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #007AFF; background: #fff; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }

        .loader { display: none; width: 25px; height: 25px; border: 3px solid #f3f3f3; border-top: 3px solid #007AFF; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎧 Диспетчер: Распределение задач</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div id="main-loader" class="loader"></div>
            <button class="btn btn-outline" onclick="goToProfile()">👤 Профиль</button>
            <button class="btn" onclick="loadData()">🔄 Обновить</button>
            <button class="btn btn-red" onclick="logout()">Выйти</button>
        </div>
    </div>

    <div class="filters-container">
        <div class="filters-grid">
            <div class="filter-group"><label>Клиент</label><input type="text" id="f-name" placeholder="Фамилия..." oninput="filterData()"></div>
            <div class="filter-group"><label>Телефон</label><input type="text" id="f-phone" placeholder="79..." oninput="filterData()"></div>
            <div class="filter-group"><label>Город</label><input type="text" id="f-city" placeholder="Город..." oninput="filterData()"></div>
            <div class="filter-group"><label>Улица</label><input type="text" id="f-street" placeholder="Улица..." oninput="filterData()"></div>
            <div class="filter-group"><label>Месяц назн.</label><input type="text" id="f-month" placeholder="Месяц..." oninput="filterData()"></div>
            <div class="filter-group">
                <label>Мастер</label>
                <select id="f-master" onchange="filterData()">
                    <option value="all">Все мастера</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Статус</label>
                <select id="f-status" onchange="filterData()">
                    <option value="all">Все статусы</option>
                    <option value="created">Создана</option>
                    <option value="scheduled">Распределена</option>
                    <option value="in_work">В работе</option>
                    <option value="done">Выполнена</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Приоритет</label>
                <select id="f-vip" onchange="filterData()">
                    <option value="all">Все</option>
                    <option value="vip">Только VIP ⭐️</option>
                    <option value="not_vip">Без VIP</option>
                </select>
            </div>
            <div class="filter-group"><label>Визит С</label><input type="date" id="f-date-start" onchange="filterData()"></div>
            <div class="filter-group"><label>Визит ПО</label><input type="date" id="f-date-end" onchange="filterData()"></div>
        </div>
        <div class="filter-row-actions">
            <span id="counter" style="font-size: 13px; color: #666; margin-right: auto;">Найдено: 0</span>
            <button class="btn btn-outline" onclick="resetFilters()">Сбросить</button>
        </div>
    </div>

    <div class="card">
        <div class="table-container">
            <table>
                <thead>
                    <tr id="table-headers">
                        <th onclick="setSort('is_vip')" data-field="is_vip">VIP <span class="sort-icon"></span></th>
                        <th onclick="setSort('last_name')" data-field="last_name">Клиент <span class="sort-icon"></span></th>
                        <th onclick="setSort('phone')" data-field="phone">Телефон <span class="sort-icon"></span></th>
                        <th onclick="setSort('assigned_month')" data-field="assigned_month">Месяц <span class="sort-icon"></span></th>
                        <th onclick="setSort('city')" data-field="city">Полный адрес <span class="sort-icon"></span></th>
                        <th onclick="setSort('status')" data-field="status">Статус <span class="sort-icon"></span></th>
                        <th onclick="setSort('master_id')" data-field="master_id">Мастер <span class="sort-icon"></span></th>
                        <th onclick="setSort('scheduled_date')" data-field="scheduled_date">Дата визита <span class="sort-icon"></span></th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="assign-modal">
        <div class="modal-content">
            <h2 id="modal-title">Назначение мастера</h2>
            <div id="client-info-preview" class="info-block"></div>
            <form id="assign-form" onsubmit="saveAssignment(event)">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Выберите мастера*</label>
                    <select id="master-select" required></select>
                </div>
                <div class="form-grid">
                    <div class="form-group"><label>Дата визита*</label><input type="date" id="scheduled-date" required></div>
                    <div class="form-group">
                        <label>Время визита</label>
                        <!-- Изменено с type="time" на type="text" -->
                        <input type="text" id="scheduled-time" placeholder="Напр: 10:00-12:00">
                    </div>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Оборудование / Специфика</label>
                    <textarea id="equipment" rows="2"></textarea>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Комментарий для мастера</label>
                    <textarea id="disp-comment" rows="2"></textarea>
                </div>
                <div style="display:flex; justify-content: flex-end; gap:12px; margin-top: 30px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn" style="background:#34C759">Сохранить и отправить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = `${window.location.protocol}//${window.location.hostname}:3425`;
        let allVisits = [];
        let allMasters = [];
        let currentVisitData = null;
        let sortField = 'is_vip';
        let sortOrder = 'desc';

        const statusMap = {
            'created': { text: 'Создана', class: 'status-created' },
            'scheduled': { text: 'Распределена', class: 'status-scheduled' },
            'in_work': { text: 'В работе', class: 'status-in_work' },
            'done': { text: 'Выполнена', class: 'status-done' },
            'canceled': { text: 'Отменена', class: 'status-canceled' }
        };

        async function loadData() {
            document.getElementById('main-loader').style.display = 'inline-block';
            try {
                const token = localStorage.getItem('auth_token');
                if (!token) return logout();

                const payload = JSON.parse(atob(token.split('.')[1]));
                const dispatcherId = payload.user_id || payload.id;

                const [vRes, mRes] = await Promise.all([
                    fetch(`${API_URL}/visit/visits?dispatcher_id=${dispatcherId}`, { 
                        headers: { 'Authorization': `Bearer ${token}` } 
                    }),
                    fetch(`${API_URL}/user/masters`, { headers: { 'Authorization': `Bearer ${token}` } })
                ]);
                
                allVisits = await vRes.json();
                allMasters = await mRes.json();
                populateMasterDropdowns();
                filterData();
            } catch (e) { console.error(e); }
            finally { document.getElementById('main-loader').style.display = 'none'; }
        }

        function populateMasterDropdowns() {
            const options = allMasters.map(m => `<option value="${m.id}">${m.last_name || ''} ${m.first_name ? m.first_name[0] + '.' : ''} (@${m.username || ''})</option>`).join('');
            document.getElementById('f-master').innerHTML = '<option value="all">Все мастера</option>' + options;
            document.getElementById('master-select').innerHTML = '<option value="">-- Выберите мастера --</option>' + options;
        }

        function filterData() {
            const f = {
                name: document.getElementById('f-name').value.toLowerCase(),
                phone: document.getElementById('f-phone').value.toLowerCase(),
                city: document.getElementById('f-city').value.toLowerCase(),
                street: document.getElementById('f-street').value.toLowerCase(),
                month: document.getElementById('f-month').value.toLowerCase(), 
                master: document.getElementById('f-master').value,
                status: document.getElementById('f-status').value,
                vip: document.getElementById('f-vip').value,
                start: document.getElementById('f-date-start').value,
                end: document.getElementById('f-date-end').value
            };

            let filtered = allVisits.filter(v => {
                const sDate = v.scheduled_date ? v.scheduled_date.split('T')[0] : '';
                const vMonth = (v.assigned_month || '').toLowerCase();
                
                const matchName = `${v.client.last_name || ''} ${v.client.first_name || ''}`.toLowerCase().includes(f.name);
                const matchPhone = (v.client.phone || '').toLowerCase().includes(f.phone);
                const matchCity = (v.address.city || '').toLowerCase().includes(f.city);
                const matchStreet = (v.address.street || '').toLowerCase().includes(f.street);
                const matchMonth = vMonth.includes(f.month);
                const matchMaster = (f.master === 'all' || v.master_id == f.master);
                const matchStatus = (f.status === 'all' || v.status === f.status);
                const matchVip = (f.vip === 'all' || (f.vip === 'vip' && v.client.is_vip) || (f.vip === 'not_vip' && !v.client.is_vip));
                const matchDateRange = (!f.start || sDate >= f.start) && (!f.end || sDate <= f.end);

                return matchName && matchPhone && matchCity && matchStreet && matchMonth && matchMaster && matchStatus && matchVip && matchDateRange;
            });

            document.getElementById('counter').innerText = `Найдено: ${filtered.length}`;
            applySort(filtered);
        }

        function setSort(field) {
            if (sortField === field) sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
            else { sortField = field; sortOrder = 'asc'; }
            updateSortVisuals();
            filterData();
        }

        function updateSortVisuals() {
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.getAttribute('data-field') === sortField) th.classList.add(sortOrder === 'asc' ? 'sort-asc' : 'sort-desc');
            });
        }

        function applySort(data) {
            const accessors = {
                is_vip: v => v.client.is_vip,
                last_name: v => (v.client.last_name || '').toLowerCase(),
                phone: v => v.client.phone || '',
                assigned_month: v => v.assigned_month || '',
                city: v => {
                    const a = v.address;
                    return ((a.city || '') + (a.region || '') + (a.locality || '') + (a.street || '') + (a.house_number || '')).toLowerCase();
                },
                status: v => v.status,
                master_id: v => v.master_id || 0,
                scheduled_date: v => v.scheduled_date || ''
            };
            const accessor = accessors[sortField] || (v => v[sortField]);
            data.sort((a, b) => {
                let valA = accessor(a), valB = accessor(b);
                if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
                return 0;
            });
            renderTable(data);
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            data.forEach(v => {
                const row = document.createElement('tr');
                if (v.client.is_vip) row.classList.add('is-vip-row');
                const st = statusMap[v.status] || { text: v.status, class: '' };
                const a = v.address;
                
                const addrParts = [];
                if (a.city) addrParts.push(`г. ${a.city}`);
                if (a.region) addrParts.push(`р-н ${a.region}`);
                if (a.locality) addrParts.push(`р-н ${a.locality}`);
                if (a.street) addrParts.push(`ул. ${a.street}`);
                if (a.house_number) {
                    let h = `д. ${a.house_number}${a.letter || ''}`;
                    addrParts.push(h);
                }
                if (a.building) addrParts.push(`к. ${a.building}`);
                if (a.appartment_number) addrParts.push(`кв. ${a.appartment_number}`);
                const fullAddr = addrParts.join(', ') || '-';

                const master = allMasters.find(m => m.id === v.master_id);
                const masterDisplay = master ? `${master.last_name || ''} ${master.first_name ? master.first_name[0] + '.' : ''}`.trim() || '—' : '—';
                const fio = `${v.client.last_name || ''} ${v.client.first_name || ''} ${v.client.surname || ''}`.trim() || '-';

                row.innerHTML = `
                    <td><span class="vip-star">${v.client.is_vip ? '⭐️' : ''}</span></td>
                    <td><strong>${fio}</strong></td>
                    <td>${v.client.phone || ''}</td>
                    <td>${v.assigned_month || '—'}</td>
                    <td style="max-width:300px">${fullAddr}</td>
                    <td><span class="status-badge ${st.class}">${st.text}</span></td>
                    <td>${masterDisplay}</td>
                    <td>${v.scheduled_date ? new Date(v.scheduled_date).toLocaleDateString() : '—'}</td>
                    <td><button class="btn btn-outline" style="padding:4px 8px" onclick='openAssignModal(${JSON.stringify(v)})'>Назначить</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        function openAssignModal(v) {
            currentVisitData = v;
            const fio = `${v.client.last_name || ''} ${v.client.first_name || ''}`.trim();
            document.getElementById('client-info-preview').innerHTML = `<p><strong>Клиент:</strong> ${fio} (${v.client.phone || ''})</p><p><strong>Месяц:</strong> ${v.assigned_month || 'не указан'}</p>`;
            document.getElementById('master-select').value = v.master_id || '';
            document.getElementById('scheduled-date').value = v.scheduled_date ? v.scheduled_date.split('T')[0] : '';
            document.getElementById('scheduled-time').value = v.scheduled_time || '';
            document.getElementById('equipment').value = v.equipment_description || '';
            document.getElementById('disp-comment').value = v.dispatcher_comment || '';
            document.getElementById('assign-modal').style.display = 'flex';
        }

        async function saveAssignment(event) {
            event.preventDefault();
            let payload = { ...currentVisitData };
            payload.master_id = parseInt(document.getElementById('master-select').value);
            payload.scheduled_date = document.getElementById('scheduled-date').value + "T00:00:00Z";
            payload.scheduled_time = document.getElementById('scheduled-time').value;
            payload.equipment_description = document.getElementById('equipment').value;
            payload.dispatcher_comment = document.getElementById('disp-comment').value;
            if (payload.master_id && payload.status === 'created') payload.status = 'scheduled';

            try {
                const res = await fetch(`${API_URL}/visit/visits/${payload.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('auth_token')}` },
                    body: JSON.stringify(payload)
                });
                if (res.ok) { closeModal(); loadData(); }
            } catch (e) { alert('Ошибка сети'); }
        }

        function resetFilters() {
            ['f-name', 'f-phone', 'f-city', 'f-street', 'f-month', 'f-date-start', 'f-date-end'].forEach(id => document.getElementById(id).value = '');
            ['f-status', 'f-master', 'f-vip'].forEach(id => document.getElementById(id).value = 'all');
            filterData();
        }

        function closeModal() { document.getElementById('assign-modal').style.display = 'none'; }
        function logout() { localStorage.clear(); window.location.href = '/'; }
        function goToProfile() {
            const token = localStorage.getItem('auth_token');
            if (!token) return window.location.href = '/';
            const payload = JSON.parse(atob(token.split('.')[1]));
            localStorage.setItem('profile_user_id', payload.user_id || payload.id);
            window.location.href = `/user/profile?token=${encodeURIComponent(token)}`;
        }

        updateSortVisuals();
        loadData();
    </script>
</body>
</html>
